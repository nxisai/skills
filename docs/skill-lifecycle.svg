<svg xmlns="http://www.w3.org/2000/svg" color="#3F4B5E" viewBox="0 0 960 284" role="img" aria-label="Set up: Site Onboarding runs first. Outward, MCP Discovery makes the site's MCP server findable. Onto its own pages, Site Tag then On-Page Agent, with Model Proxy when the model runs remotely. Retrieve: Typed Retrieval queries the site's MCP server and hands off an entity @id. Act: the Quote Request, Reservation and Application funnels execute it under the LEAD_GEN, BOOKING and TXN policies.">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
          </marker>
        </defs>

        <!-- ── SET UP ──────────────────────────────────────────── -->
        <text x="0" y="14" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="1.6" fill="currentColor" opacity=".65">SET UP</text>

        <rect x="0" y="40" width="150" height="58" rx="9" fill="none" stroke="#2563EB" stroke-width="1.6"/>
        <text x="75" y="63" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="700" font-size="12.5" fill="#2563EB">Site Onboarding</text>
        <text x="75" y="81" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".7">verify · crawl · publish</text>

        <line x1="150" y1="69" x2="228" y2="69" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>
        <text x="189" y="61" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".75">outward</text>

        <rect x="230" y="40" width="150" height="58" rx="9" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <text x="305" y="63" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="700" font-size="12.5" fill="currentColor">MCP Discovery</text>
        <text x="305" y="81" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".7">findable without a URL</text>

        <line x1="75" y1="98" x2="75" y2="168" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>
        <text x="84" y="137" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".75">onto its pages</text>

        <rect x="0" y="170" width="150" height="58" rx="9" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <text x="75" y="193" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="700" font-size="12.5" fill="currentColor">Site Tag</text>
        <text x="75" y="211" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".7">JSON-LD + WebMCP tools</text>

        <line x1="150" y1="199" x2="192" y2="199" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>

        <rect x="194" y="170" width="150" height="58" rx="9" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <text x="269" y="193" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="700" font-size="12.5" fill="currentColor">On-Page Agent</text>
        <text x="269" y="211" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".7">an agent on every page</text>

        <!-- optional: only when the model runs remotely -->
        <line x1="344" y1="199" x2="386" y2="199" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ar)"/>

        <rect x="388" y="170" width="150" height="58" rx="9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="4 4"/>
        <text x="463" y="193" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="700" font-size="12.5" fill="currentColor">Model Proxy</text>
        <text x="463" y="211" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".7">if the model is remote</text>

        <!-- divider: set up runs in the project; the rest runs against the server -->
        <line x1="554" y1="24" x2="554" y2="240" stroke="currentColor" stroke-width="1" opacity=".22" stroke-dasharray="3 5"/>

        <line x1="380" y1="69" x2="568" y2="69" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>
        <text x="474" y="61" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".75">the site's MCP server</text>

        <!-- ── RETRIEVE ────────────────────────────────────────── -->
        <text x="570" y="14" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="1.6" fill="currentColor" opacity=".65">RETRIEVE</text>

        <rect x="570" y="40" width="150" height="58" rx="9" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <text x="645" y="63" text-anchor="middle" font-family="Manrope,sans-serif" font-weight="700" font-size="12.5" fill="currentColor">Typed Retrieval</text>
        <text x="645" y="81" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".7">list · query · get</text>

        <text x="645" y="120" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="#2563EB">hands off an entity @id</text>
        <text x="645" y="135" text-anchor="middle" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".6">read-only</text>

        <!-- fan-out: one @id, three funnels -->
        <line x1="720" y1="69" x2="746" y2="69" stroke="currentColor" stroke-width="1.3"/>
        <line x1="746" y1="60" x2="746" y2="188" stroke="currentColor" stroke-width="1.3"/>
        <line x1="746" y1="60" x2="772" y2="60" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>
        <line x1="746" y1="124" x2="772" y2="124" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>
        <line x1="746" y1="188" x2="772" y2="188" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>

        <!-- ── ACT ─────────────────────────────────────────────── -->
        <text x="774" y="14" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="1.6" fill="currentColor" opacity=".65">ACT</text>

        <rect x="774" y="34" width="184" height="52" rx="9" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="786" y="56" font-family="Manrope,sans-serif" font-weight="700" font-size="12" fill="currentColor">Quote Request</text>
        <text x="946" y="56" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="currentColor">LEAD_GEN</text>
        <text x="786" y="74" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".7">up to 3 providers</text>

        <rect x="774" y="98" width="184" height="52" rx="9" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="786" y="120" font-family="Manrope,sans-serif" font-weight="700" font-size="12" fill="currentColor">Reservation</text>
        <text x="946" y="120" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="currentColor">BOOKING</text>
        <text x="786" y="138" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".7">commits a slot</text>

        <rect x="774" y="162" width="184" height="52" rx="9" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <text x="786" y="184" font-family="Manrope,sans-serif" font-weight="700" font-size="12" fill="currentColor">Application</text>
        <text x="946" y="184" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="currentColor">TXN</text>
        <text x="786" y="202" font-family="Inter,sans-serif" font-size="10.5" fill="currentColor" opacity=".7">every field reviewed</text>

        <text x="0" y="268" font-family="Inter,sans-serif" font-size="11.5" fill="currentColor" opacity=".65">runs in your project · stops for every deploy</text>
        <text x="958" y="268" text-anchor="end" font-family="Inter,sans-serif" font-size="11.5" fill="currentColor" opacity=".65">runs against the site's MCP server · nothing writes without consent</text>
      </svg>
