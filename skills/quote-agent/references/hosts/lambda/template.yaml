# hosts/lambda/template.yaml — the Quote Agent on AWS: one function behind a
# Function URL, one DynamoDB table, read access to three SSM parameters.
#
# Status: DRAFT. Deployed to LocalStack 4.2.1 (CloudFormation with the SAM
# transform, CodeUri pointed at the esbuild bundle in S3); not deployed to AWS.
# Run `sam validate --lint` and `sam build`, then deploy only when the user says
# so — it creates billable resources in their account.
#
# Not in here, on purpose:
# - The SecureString parameters. CloudFormation cannot create SecureStrings; the
#   user creates them once (see ../lambda.md, "Secrets").
# - The CloudFront routing. The site's existing distribution gets one origin and
#   two behaviors (../lambda.md, "Same origin"); this stack only outputs the URL.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Quote Agent (quote-agent skill) — A2A endpoint on a Lambda Function URL

Parameters:
  PublicOrigin:
    Type: String
    Description: The site's public origin, scheme included (https://example.com). The Agent Card points here.
  SecretsPrefix:
    Type: String
    Default: /quote-agent/prod/
    AllowedPattern: '^/.*/$'
    Description: SSM path holding anthropic-api-key, a2a-relay-token, webhook-signing-secret (SecureString).
  QuoteModel:
    Type: String
    Default: claude-sonnet-5-5
  QuoteSinkUrl:
    Type: String
    Description: Where the site's quote form posts, fixed server-side (https://example.com/api/quote).
  CardWellKnown:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: "'false' when another agent already serves /.well-known/agent-card.json."

Resources:
  QuoteTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      # task#, progress# (7 days) and sent# (30 days) items expire on their own.
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      SSESpecification: { SSEEnabled: true }

  QuoteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 512
      # A turn: one model call (15 s cap, one retry) and, on a yes, the sink (10 s cap).
      # Buffered, so CloudFront waits for the whole turn: set its origin read timeout to 60 s.
      Timeout: 45
      # Optional spend cap. Leave out on a new account whose concurrency quota is 10.
      # ReservedConcurrentExecutions: 10
      FunctionUrlConfig:
        # The relay's bearer token is the gate, checked in the handler (constant time).
        # AWS_IAM + CloudFront OAC would take the Authorization header for SigV4.
        AuthType: NONE
        # One turn ends at input-required or completed: the whole SSE body is sent at once.
        InvokeMode: BUFFERED
      Environment:
        Variables:
          PUBLIC_ORIGIN: !Ref PublicOrigin
          QUOTE_TABLE: !Ref QuoteTable
          QUOTE_SECRETS_PREFIX: !Ref SecretsPrefix
          QUOTE_MODEL: !Ref QuoteModel
          QUOTE_SINK_URL: !Ref QuoteSinkUrl
          QUOTE_CARD_WELL_KNOWN: !Ref CardWellKnown
      Policies:
        # Least privilege: three item operations on this table, and reading the three parameters.
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem]
              Resource: !GetAtt QuoteTable.Arn
            - Effect: Allow
              Action: ssm:GetParameters
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SecretsPrefix}anthropic-api-key
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SecretsPrefix}a2a-relay-token
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SecretsPrefix}webhook-signing-secret
            # SecureStrings under the AWS managed key aws/ssm need no KMS grant here.
            # Under a customer managed key, add kms:Decrypt on that key's ARN.
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [handler.ts]
        Target: node22
        Format: cjs
        Sourcemap: true
        Minify: false

  QuoteFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${QuoteFunction}
      RetentionInDays: 14

Outputs:
  FunctionUrl:
    Description: The CloudFront origin for /a2a/quote* and /.well-known/agent-card.json (or the relay target's endpoint, own-origin)
    Value: !GetAtt QuoteFunctionUrl.FunctionUrl
  TableName:
    Value: !Ref QuoteTable
